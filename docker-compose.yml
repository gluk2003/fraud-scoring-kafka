x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TRANSACTIONS_TOPIC: "transactions"
  KAFKA_SCORES_TOPIC: "scores"

x-postgres-env: &postgres-env
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fraud"
  POSTGRES_USER: "fraud"
  POSTGRES_PASSWORD: "fraud"

services:
  # Zookeeper (обязательный для Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - ml-scorer
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Брокер Kafka
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    networks:
      - ml-scorer
    ports:
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Создание топиков при старте
  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ml-scorer
    restart: on-failure
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo 'Создание топиков...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic scores --partitions 3 --replication-factor 1 --config retention.ms=604800000
      echo 'Топики успешно созданы:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  # Веб-интерфейс для просмотра топиков
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ml-scorer
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # БД с витриной результатов скоринга
  postgres:
    build: ./postgres
    networks:
      - ml-scorer
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "fraud"
      POSTGRES_USER: "fraud"
      POSTGRES_PASSWORD: "fraud"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ML-сервис: transactions -> препроцессинг -> модель -> scores
  fraud_detector:
    build: ./fraud_detector
    networks:
      - ml-scorer
    environment:
      <<: *kafka-env
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Выгрузка результатов скоринга из топика scores в PostgreSQL
  db_writer:
    build: ./db_writer
    networks:
      - ml-scorer
    environment:
      <<: [*kafka-env, *postgres-env]
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Streamlit UI: отправка транзакций и просмотр результатов
  interface:
    build: ./interface
    networks:
      - ml-scorer
    environment:
      <<: *postgres-env
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "transactions"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  pg_data:

networks:
  ml-scorer:
    name: ml-scorer
    driver: bridge
